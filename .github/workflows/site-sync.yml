name: Цифры с сайта biz-com.kz
# Раз в неделю сверяет опыт, число сертификатов и цену «Старт» с сайтом
on:
  schedule:
    - cron: '0 2 * * 1'   # понедельник 07:00 по Алматы
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Сверить цифры
        id: sync
        run: node .github/scripts/site-sync.js
      - name: Сохранить
        if: steps.sync.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          git config user.name "barononlinekz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets site-state.json
          git commit -m "Профиль: цифры с сайта ($SUMMARY)"
          git push
