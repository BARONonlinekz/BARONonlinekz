name: Змейка по графику вкладов
# Раз в сутки рисует змейку и кладёт её в ветку output
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark&color_snake=#5FE06A&color_dots=#131E2A,#16301C,#1F6B2A,#3FAE4A,#5FE06A
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
