name: Последние видео YouTube
# Раз в сутки подтягивает свежие видео канала в README (между метками VIDEO-LIST)
on:
  schedule:
    - cron: '0 1 * * *'   # 06:00 по Алматы
  workflow_dispatch:
permissions:
  contents: write
jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: VIDEO-LIST
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCJhY2Lgjjy2VsZ5w9uEgijg"
          max_post_count: 3
          custom_tags: "videoId/yt:videoId/"
          date_format: "dd.mm.yyyy"
          template: '<a href="$url"><img width="30%" src="https://img.youtube.com/vi/$videoId/mqdefault.jpg" alt="$title"/></a> '
          commit_message: "Профиль: свежие видео YouTube"
          committer_username: "barononlinekz-bot"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
